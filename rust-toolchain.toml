# One Rust toolchain for everything this repository compiles.
#
# "1.86" is the exact channel string Sputnik DAO v3.2 pins in its own rust-toolchain.toml
# (near-daos/sputnik-dao-contract at 2b0f34a3), so Headcount and Sputnik's test token (both built
# by scripts/build-contracts.mjs) compile with the toolchain Sputnik v3.2 itself was built with.
[toolchain]
channel = "1.86"
components = ["rustfmt", "clippy"]
targets = ["wasm32-unknown-unknown"]
profile = "minimal"
